<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limbus Company · Damage Calculator</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Shared CSS -->
  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/components.css">
  <!-- Calculator CSS -->
  <link rel="stylesheet" href="/limbus/css/calculator.css">
</head>
<body class="dark">
  <div class="app-container" id="app">
    <header class="app-header">
      <div class="app-header-title">
        <h1>Limbus Company Damage Calculator</h1>
        <span class="bot-credit" id="bot-credit"></span>
      </div>
      <div class="app-header-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <div id="picker" class="card"></div>
    <div id="buff-bar" class="card"></div>
    <div id="settings" class="card"></div>
    <div id="buckets"></div>
  </div>

  <script type="module">
    import { initTheme, toggleTheme, setThemeColor } from '/shared/js/theme.js';
    import { initConfig } from '/shared/js/config.js';
    import { init } from '/limbus/js/ui.js';

    // Initialize theme (reads localStorage preference)
    initTheme();

    // Theme toggle button
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

    // Fetch bot config, apply branding and theme color
    initConfig('bot-credit', setThemeColor);

    // Initialize calculator UI
    init();
  </script>
</body>
</html>
