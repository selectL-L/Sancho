name: Build Sancho

on:
  push:
    branches: [ "Master" ]
    paths:
      - 'README.md'
      - 'BUILD.md'
  pull_request:
    branches: [ "Master" ]
    paths:
      - 'README.md'
      - 'BUILD.md'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download FFmpeg (Windows)
      if: runner.os == 'Windows'
      run: |
        $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
        Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
        Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-temp
        Move-Item -Path ffmpeg-temp/*/bin/ffmpeg.exe -Destination ffmpeg.exe
        Remove-Item -Recurse -Force ffmpeg-temp, ffmpeg.zip

    - name: Download FFmpeg (Linux)
      if: runner.os == 'Linux'
      run: |
        curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
        tar -xf ffmpeg.tar.xz
        mv ffmpeg-*-static/ffmpeg ffmpeg
        chmod +x ffmpeg
        rm -rf ffmpeg-*-static ffmpeg.tar.xz

    - name: Download FFmpeg (macOS)
      if: runner.os == 'macOS'
      run: |
        curl -L https://evermeet.cx/ffmpeg/getrelease/zip -o ffmpeg.zip
        unzip ffmpeg.zip
        rm ffmpeg.zip

    - name: Create Dummy Info Env
      run: |
        echo "DISCORD_TOKEN=build_token" > info.env
        echo "BOT_PREFIX=!" >> info.env
        echo "BOT_NAME=Sancho" >> info.env

    - name: Build with PyInstaller
      run: python build.py

    - name: Upload Artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: Sancho-Windows
        path: dist/Sancho.exe

    - name: Upload Artifact (Linux/macOS)
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: Sancho-${{ matrix.os }}
        path: dist/Sancho
