name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Create dummy info.env
      run: |
        echo "DISCORD_TOKEN=test_token" > info.env
        echo "BOT_PREFIX=!" >> info.env
        echo "BOT_NAME=Sancho" >> info.env

    - name: Lint with Ruff
      run: ruff check cogs utils tests config.py main.py migrate_db.py build.py

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Create dummy info.env
      run: |
        echo "DISCORD_TOKEN=test_token" > info.env
        echo "BOT_PREFIX=!" >> info.env
        echo "BOT_NAME=Sancho" >> info.env

    - name: Run tests with pytest
      run: |
        pytest
