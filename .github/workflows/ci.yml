name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Create dummy info.env
      run: |
        echo "DISCORD_TOKEN=test_token" > info.env
        echo "BOT_PREFIX=!" >> info.env
        echo "BOT_NAME=Sancho" >> info.env

    - name: Lint with Ruff
      run: |
        ruff check \
          --line-length=180 \
          --target-version=py312 \
          --select=F,B,S,C4,PIE,PLE,RUF,ASYNC,T10,SLOT,PERF \
          --ignore=S110,S311,S104,S101,S105,S106,B008,B010,RUF012,RUF005,RUF022,ASYNC109,PERF203,PERF401,PERF102,ASYNC230,S608,S607,S112,PLR2004,PLC0415 \
          cogs utils tests config.py main.py migrate_db.py build.py

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Create dummy info.env
      run: |
        echo "DISCORD_TOKEN=test_token" > info.env
        echo "BOT_PREFIX=!" >> info.env
        echo "BOT_NAME=Sancho" >> info.env

    - name: Run tests with pytest
      run: |
        pytest
